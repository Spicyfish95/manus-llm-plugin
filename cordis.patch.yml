- insert:
    - id: manus-llm
      name: 'dsh-manus-llm'
      config:
        apiKeyEnv: MANUS_API_KEY
        defaultProfile: standard
        locale: zh-CN
        pollIntervalMs: 2000
        pollMaxSeconds: 1200
        requestTimeoutMs: 60000
        contextWindow: 1000000
        maxTokens: 32000
        trackCredits: true
        showProgress: false
        verboseEvents: false
